[project]
name = "amazon-india-seller-mcp"
version = "0.2.1"
description = "Amazon India product research MCP server for beginner sellers (stdio transport, Claude Desktop ready)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suriya Ravichandran" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "amazon",
    "amazon-india",
    "product-research",
    "ecommerce",
    "claude",
    "seller-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Free live data sources, no API keys required.
realtime = [
    "ddgs>=9.15.0",
    "pytrends>=4.9",
]
# Page fetching and HTML parsing for the Amazon India scraping tools.
browser = [
    "playwright>=1.40",
    "selectolax>=0.3.21",
]

# NOTE: table headers must come after every bare key in [project], or the keys
# below them are parsed as part of that table instead.
[project.scripts]
amazon-india-seller-mcp = "amazon_india_seller_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Suriya-Ravichandran/amazon-india-seller-mcp"
Repository = "https://github.com/Suriya-Ravichandran/amazon-india-seller-mcp"
Issues = "https://github.com/Suriya-Ravichandran/amazon-india-seller-mcp/issues"
Documentation = "https://github.com/Suriya-Ravichandran/amazon-india-seller-mcp/tree/main/docs"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amazon_india_seller_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/amazon_india_seller_mcp",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/.env.example",
    "/mcp.json.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
