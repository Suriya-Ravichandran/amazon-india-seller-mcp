[project]
name = "amazon-product-mcp"
version = "0.1.0"
description = "Amazon India product research MCP server for beginner sellers (stdio transport, Claude Desktop ready)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
realtime = [
    "ddgs>=9.15.0",
    "pytrends>=4.9",
]
browser = [
    "playwright>=1.40",
    "selectolax>=0.3.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Virtual project: dependencies are managed by uv, but the source tree itself is
# run directly (python server.py) rather than installed as a distribution.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
