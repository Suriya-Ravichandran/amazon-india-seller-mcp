name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        # The suite is fully offline: no live Google Trends, web search or page fetching.
        run: uv run pytest -q

      - name: Verify the MCP server starts and registers every tool
        run: uv run docs/check_connection.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit --strict --ignore-vuln GHSA-none || true

      - name: Run the security control tests
        run: uv run pytest tests/test_security.py -v

      - name: Check no secrets are committed
        run: |
          if git ls-files | grep -qx '.env'; then
            echo "::error::.env is tracked by git - it must stay ignored"
            exit 1
          fi
          echo "No .env in the index."
